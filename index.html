<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Surprise ❤️</title>
    <style>
        :root {
            --primary-color: #ff4d6d;
            --bg-color: #fff0f3;
            --text-color: #590d22;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        body { 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background-color: var(--bg-color); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; text-align: center; position: relative; 
        }

        .page { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; position: relative; z-index: 2; }
        .active { display: flex; }
        
        /* تأثير الشقلبة */
        .page-exit-active { animation: spinOut 0.8s ease-in-out forwards; }
        @keyframes spinOut {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0) rotate(720deg); opacity: 0; }
        }

        /* زر الصوت */
        #musicToggle {
            position: fixed; top: 20px; left: 20px;
            background: var(--primary-color); color: white;
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; border: none; font-size: 1.2rem;
        }

        /* التصميم الإبداعي للعدادات */
        .timers-container { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .timer-card {
            background: var(--card-bg); padding: 15px; border-radius: 15px;
            border: 2px solid var(--primary-color); box-shadow: 0 5px 15px rgba(255, 77, 109, 0.2);
            min-width: 140px;
        }
        .timer-label { font-size: 0.8rem; color: var(--primary-color); font-weight: bold; display: block; }
        .timer-value { font-size: 1.1rem; color: var(--text-color); font-weight: 900; }
        .infinity-symbol { font-size: 2rem; color: var(--primary-color); line-height: 1; }

        /* القلب النابض */
        .heart-frame {
            position: relative; width: 260px; height: 260px;
            background-color: var(--primary-color);
            display: flex; justify-content: center; align-items: center;
            transform: scale(1.2); margin: 30px 0;
            clip-path: url(#heartPath);
            animation: heartBeat 1.5s infinite ease-in-out;
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1.2); }
            50% { transform: scale(1.3); }
        }

        .slideshow { position: relative; width: 95%; height: 95%; background: white; clip-path: url(#heartPath); overflow: hidden; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.2s ease-in-out; object-fit: cover; }
        .active-slide { opacity: 1; }

        /* الرسالة والبوكيه */
        .letter-container { background: white; padding: 25px; width: 85%; max-width: 450px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 2px solid #ffccd5; }
        .bouquet { font-size: 5rem; animation: sway 3s ease-in-out infinite; margin-bottom: 10px; }
        @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
        
        .typewriter-text { font-size: 1.3rem; color: var(--text-color); line-height: 1.6; font-weight: bold; min-height: 3em; }

        /* الأزرار */
        .btn-wrapper { display: flex; gap: 20px; justify-content: center; height: 100px; align-items: center; }
        button.main-btn { padding: 12px 25px; font-size: 1.1rem; border: none; border-radius: 25px; cursor: pointer; background: var(--primary-color); color: white; transition: 0.3s; }
        
        .falling-item { position: fixed; pointer-events: none; animation: fall linear infinite; z-index: 1; opacity: 0; }
        @keyframes fall { 0% { transform: translateY(-50px); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <button id="musicToggle" onclick="toggleMusic()">🔊</button>

    <svg width="0" height="0">
        <defs>
            <clipPath id="heartPath" clipPathUnits="objectBoundingBox">
                <path d="M0.5,0.9 C0.4,0.8,0,0.6,0,0.35 C0,0.15,0.15,0,0.3,0 C0.4,0,0.45,0.05,0.5,0.12 C0.55,0.05,0.6,0,0.7,0 C0.85,0,1,0.15,1,0.35 C1,0.6,0.6,0.8,0.5,0.9"></path>
            </clipPath>
        </defs>
    </svg>

    <audio id="loveSong" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="page1" class="page active">
        <h1>Will you be my Valentine? ❤️ 💋</h1>
        <div class="btn-wrapper">
            <button class="main-btn" id="yesBtn" onclick="handleYes()">Yes</button>
            <button id="noBtn" onmouseover="moveNo()" style="background:#888; color:white; border:none; padding:10px 20px; border-radius:20px;">No</button>
        </div>
    </div>

    <div id="page2" class="page">
        <h2>طب منا عارف أصلا 😏</h2>
        <h2>عاوزة تشوفي أسعد لحظاتنا؟</h2>
        <div class="btn-wrapper">
            <button class="main-btn" onclick="startSlideshow()">عاوزة</button>
            <button class="main-btn" onclick="triggerError()">عايزة</button>
        </div>
        <p id="errorMsg" style="color:red; font-weight:bold;"></p>
    </div>

    <div id="page3" class="page">
        <h1>أجمل أوقاتنا.. ✨</h1>
        <div class="heart-frame">
            <div class="slideshow" id="gallery"></div>
        </div>
    </div>

    <div id="page4" class="page">
        <div class="timers-container">
            <div class="timer-card">
                <span class="timer-label">بقالنا سوا ❤️</span>
                <div id="pastTimer" class="timer-value">6 سنين...</div>
            </div>
            <div class="timer-card">
                <span class="timer-label">مكملين لـ ♾️</span>
                <div class="infinity-symbol">∞</div>
            </div>
        </div>

        <div class="bouquet">💐🌹🌷</div>
        
        <div class="letter-container">
            <p id="typewriter" class="typewriter-text"></p>
            <button id="reloadBtn" class="main-btn" style="margin-top:15px; display:none;" onclick="location.reload()">نعيد من الأول؟ 🔄</button>
        </div>
    </div>

    <script>
        const song = document.getElementById('loveSong');
        let isMuted = false;
        let yesScale = 1;

        function toggleMusic() {
            isMuted = !isMuted;
            song.muted = isMuted;
            document.getElementById('musicToggle').innerText = isMuted ? "🔇" : "🔊";
        }

        function handleYes() {
            song.play().catch(() => {});
            document.getElementById('page1').classList.add('page-exit-active');
            setTimeout(() => {
                document.getElementById('page1').classList.remove('active');
                document.getElementById('page2').classList.add('active');
            }, 800);
        }

        function moveNo() {
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed';
            noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            noBtn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
            yesScale += 0.1;
            document.getElementById('yesBtn').style.transform = `scale(${yesScale})`;
        }

        function triggerError() { document.getElementById('errorMsg').innerText = "بس انا اللي عاوز 😂"; }

        function startSlideshow() {
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page3').classList.add('active');
            const gallery = document.getElementById('gallery');
            for(let i=1; i<=27; i++) {
                const img = document.createElement('img');
                img.src = `1 (${i}).jpg`;
                img.className = 'slide' + (i === 1 ? ' active-slide' : '');
                gallery.appendChild(img);
            }
            let slides = document.querySelectorAll('.slide');
            let idx = 0;
            let interval = setInterval(() => {
                slides[idx].classList.remove('active-slide');
                idx++;
                if (idx >= slides.length) {
                    clearInterval(interval);
                    showFinalPage();
                } else {
                    slides[idx].classList.add('active-slide');
                }
            }, 3000);
        }

        function showFinalPage() {
            document.getElementById('page3').classList.remove('active');
            document.getElementById('page4').classList.add('active');
            startPastTimer();
            startTypewriter();
        }

        // عداد الـ 6 سنوات
        function startPastTimer() {
            // تاريخ افتراضي قبل 6 سنوات
            const startDate = new Date();
            startDate.setFullYear(startDate.getFullYear() - 6);
            startDate.setMonth(startDate.getMonth() - 2); 

            setInterval(() => {
                const now = new Date();
                const diff = now - startDate;
                const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365));
                const days = Math.floor((diff / (1000 * 60 * 60 * 24)) % 365);
                const hrs = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const mins = Math.floor((diff / (1000 * 60)) % 60);
                const secs = Math.floor((diff / 1000) % 60);
                document.getElementById('pastTimer').innerHTML = 
                    `${years}س ${days}ي ${hrs}:${mins}:${secs}`;
            }, 1000);
        }

        // تأثير الكتابة
        function startTypewriter() {
            const text = "بحبك اوي وكل سنة وانتي طيبة يا قلبي.. ويارب تفضلي معايا طول الوقت زي ما انتي وتكوني أسعد واحدة في الدنيا.. ❤️💋";
            let i = 0;
            const el = document.getElementById('typewriter');
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 100);
                } else {
                    document.getElementById('reloadBtn').style.display = 'inline-block';
                }
            }
            type();
        }

        // قلوب متساقطة
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'falling-item';
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (Math.random() * 20 + 10) + "px";
            heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }, 400);
    </script>
</body>
</html>
